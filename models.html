<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111820">
<meta name="description" content="Pilih model unit TEREX untuk membuka katalog suku cadang.">
<title>Pilih Model Unit | TEREX PartBook</title>
<link rel="stylesheet" href="models.css?v=model-selector">
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html" aria-label="TEREX PartBook">
    <span class="logo">T</span>
    <span><strong>TEREX PartBook</strong><small>Katalog suku cadang unit</small></span>
  </a>
  <a class="back-link" href="index.html">Kembali ke AC40</a>
</header>
<main class="page">
  <section class="intro">
    <div class="eyebrow">PILIH UNIT</div>
    <h1>Pilih model TEREX</h1>
    <p>Pilih model unit untuk melihat katalog suku cadangnya.</p>
  </section>
  <section class="unit-grid" aria-label="Daftar model unit TEREX">
    <a class="unit-card available" href="index.html" aria-label="Buka katalog TEREX AC40">
      <span class="unit-mark">AC40</span>
      <span class="unit-info"><strong>TEREX AC40</strong><small>Katalog tersedia</small></span>
      <span class="unit-arrow" aria-hidden="true">→</span>
    </a>
    <button class="unit-card" type="button" data-model="TEREX AC80-2" aria-pressed="false">
      <span class="unit-mark">AC80-2</span>
      <span class="unit-info"><strong>TEREX AC80-2</strong><small>Segera tersedia</small></span>
      <span class="unit-arrow" aria-hidden="true">→</span>
    </button>
    <button class="unit-card" type="button" data-model="TEREX AC100-4" aria-pressed="false">
      <span class="unit-mark">AC100-4</span>
      <span class="unit-info"><strong>TEREX AC100-4</strong><small>Segera tersedia</small></span>
      <span class="unit-arrow" aria-hidden="true">→</span>
    </button>
    <button class="unit-card" type="button" data-model="TEREX AC140C" aria-pressed="false">
      <span class="unit-mark">AC140C</span>
      <span class="unit-info"><strong>TEREX AC140C</strong><small>Segera tersedia</small></span>
      <span class="unit-arrow" aria-hidden="true">→</span>
    </button>
    <button class="unit-card" type="button" data-model="TEREX AC200-1" aria-pressed="false">
      <span class="unit-mark">AC200-1</span>
      <span class="unit-info"><strong>TEREX AC200-1</strong><small>Segera tersedia</small></span>
      <span class="unit-arrow" aria-hidden="true">→</span>
    </button>
    <button class="unit-card" type="button" data-model="TEREX AC250-1" aria-pressed="false">
      <span class="unit-mark">AC250-1</span>
      <span class="unit-info"><strong>TEREX AC250-1</strong><small>Segera tersedia</small></span>
      <span class="unit-arrow" aria-hidden="true">→</span>
    </button>
    <button class="unit-card" type="button" data-model="TEREX AC350-6" aria-pressed="false">
      <span class="unit-mark">AC350-6</span>
      <span class="unit-info"><strong>TEREX AC350-6</strong><small>Segera tersedia</small></span>
      <span class="unit-arrow" aria-hidden="true">→</span>
    </button>
  </section>
  <p id="selection-message" class="selection-message" role="status" aria-live="polite">Katalog yang tersedia saat ini: TEREX AC40.</p>
</main>
<script src="models.js?v=model-selector"></script>
</body>
</html>
